<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迈克尔逊干涉条纹分析工具 (带通+过零)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #0a0e1a;
            background-image: radial-gradient(circle at 20% 30%, rgba(6, 182, 212, 0.15) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
            color: #e2e8f0;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: linear-gradient(rgba(148, 163, 184, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(148, 163, 184, 0.03) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; z-index: 0;
        }
        body > * { position: relative; z-index: 1; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #06b6d4, #3b82f6); border-radius: 4px; }
        .glass-card {
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.15); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.35s ease;
        }
        .glass-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(6, 182, 212, 0.12); border-color: rgba(6, 182, 212, 0.25); }
        .gradient-border { position: relative; }
        .gradient-border::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6, #8b5cf6); background-size: 200% 200%;
            animation: gradientFlow 8s ease infinite; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }
        @keyframes gradientFlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .glow-text { text-shadow: 0 0 20px rgba(6, 182, 212, 0.5); }
        .section-title { position: relative; padding-left: 16px; }
        .section-title::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 4px; height: 70%; background: linear-gradient(180deg, #06b6d4, #3b82f6);
            border-radius: 2px; box-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
        }
        .input-dark { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(148, 163, 184, 0.2); color: #e2e8f0; border-radius: 8px; padding: 10px 14px; outline: none; transition: 0.2s; }
        .input-dark:focus { border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15); }
        .btn-main { background: linear-gradient(135deg, #06b6d4, #3b82f6); color: white; padding: 12px 28px; border-radius: 8px; border: none; font-weight: 500; transition: 0.25s; }
        .btn-main:hover { box-shadow: 0 0 16px rgba(6, 182, 212, 0.4); transform: translateY(-2px); }
        .result-block { background: rgba(15, 23, 42, 0.5); border-left: 3px solid #06b6d4; padding: 18px 22px; border-radius: 0 10px 10px 0; }
        .result-value { color: #06e0f0; font-weight: 600; font-size: 18px; }
        .warn-block { background: rgba(245, 158, 11, 0.1); border-left: 3px solid #f59e0b; padding: 12px 16px; border-radius: 0 8px 8px 0; color: #fcd34d; font-size: 13px; }
        .chart-wrap { background: radial-gradient(circle, #0f172a 0%, #020617 100%); border-radius: 12px; padding: 12px; box-shadow: inset 0 0 30px rgba(0,0,0,0.4); }
        .fade-animate { animation: fadeUp 0.7s ease forwards; opacity: 0; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.25s; } .delay-3 { animation-delay: 0.4s; }
    </style>
</head>
<body class="min-h-screen pb-20">
    <header class="relative py-14 px-6 text-center overflow-hidden fade-animate">
        <div class="absolute inset-0 opacity-20">
            <div class="absolute top-8 left-1/4 w-60 h-60 rounded-full bg-cyan-500 blur-3xl animate-pulse"></div>
            <div class="absolute bottom-0 right-1/4 w-72 h-72 rounded-full bg-blue-600 blur-3xl animate-pulse" style="animation-delay:1s"></div>
        </div>
        <div class="relative z-10">
            <p class="text-cyan-400 text-sm tracking-widest mb-3">PHYPHOX 光强数据 · 物理过零检测</p>
            <h1 class="text-4xl md:text-5xl font-bold glow-text bg-gradient-to-r from-cyan-300 via-blue-400 to-purple-400 bg-clip-text text-transparent mb-4">
                迈克尔逊干涉条纹分析工具
            </h1>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto">
                自动采样率 · 频域带通滤波 · 自适应滞回过零计数 · 累积条纹可视化
            </p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 space-y-10">
        <section class="glass-card rounded-2xl p-8 gradient-border fade-animate delay-1">
            <h2 class="section-title text-2xl font-semibold text-cyan-300 mb-6">1. 上传光强数据文件</h2>
            <input class="input-dark w-full" type="file" id="fileInput" accept=".txt,.csv">
            <div id="fileInfo" class="text-slate-400 text-sm mt-3"></div>
        </section>

        <section class="glass-card rounded-2xl p-8 gradient-border fade-animate delay-2">
            <h2 class="section-title text-2xl font-semibold text-cyan-300 mb-6">2. 算法参数配置</h2>
            <div class="grid md:grid-cols-2 gap-5 mb-4">
                <div>
                    <label class="text-slate-300 text-sm block mb-2">采样率 (Hz) <span class="text-slate-500 text-xs">— 留空自动提取</span></label>
                    <input class="input-dark w-full" type="number" id="samplingRate" placeholder="自动检测" step="1">
                </div>
                <div>
                    <label class="text-slate-300 text-sm block mb-2">带通滤波下限 min_freq (Hz)</label>
                    <input class="input-dark w-full" type="number" id="minFreq" value="1.0" step="0.1">
                </div>
                <div>
                    <label class="text-slate-300 text-sm block mb-2">带通滤波上限 max_freq (Hz)</label>
                    <input class="input-dark w-full" type="number" id="maxFreq" value="15.0" step="0.1">
                </div>
                <div>
                    <label class="text-slate-300 text-sm block mb-2">过零阈值系数 (0~1) <span class="text-slate-500 text-xs">— 默认0.3抗噪</span></label>
                    <input class="input-dark w-full" type="number" id="thresholdCoeff" value="0.3" step="0.05" min="0.1" max="0.9">
                </div>
                <div>
                    <label class="text-slate-300 text-sm block mb-2">条纹修正系数 <span class="text-slate-500 text-xs">— 默认1.0</span></label>
                    <input class="input-dark w-full" type="number" id="fringeCoeff" value="1.0" step="0.01">
                </div>
                <div>
                    <label class="text-slate-300 text-sm block mb-2">动镜位移 displacement (mm)</label>
                    <input class="input-dark w-full" type="number" id="displacement" placeholder="如 0.05" step="0.001">
                </div>
            </div>
            <button class="btn-main" onclick="runFullAnalysis()">执行分析计算</button>
        </section>

        <section class="glass-card rounded-2xl p-8 gradient-border fade-animate delay-2">
            <h2 class="section-title text-2xl font-semibold text-cyan-300 mb-6">3. 计算结果与诊断</h2>
            <div class="result-block">
                <p class="text-slate-300 text-base my-3">识别总条纹数 N：<span class="result-value" id="fringeCount">--</span></p>
                <p class="text-slate-300 text-base my-3">波长 λ (米)：<span class="result-value" id="waveM">--</span></p>
                <p class="text-slate-300 text-base my-3">波长 λ (纳米)：<span class="result-value" id="waveNm">--</span></p>
                <p class="text-slate-300 text-base my-3">系统采样率：<span class="result-value" id="actualFs">--</span> Hz</p>
                <p class="text-slate-300 text-base my-3">估算平均条纹频率：<span class="result-value" id="estFreq">--</span> Hz</p>
                <p id="errMsg" class="text-red-400 text-sm mt-2"></p>
                <p id="warnMsg" class="text-amber-400 text-sm mt-2"></p>
            </div>
        </section>

        <section class="glass-card rounded-2xl p-8 gradient-border fade-animate delay-3">
            <h2 class="section-title text-2xl font-semibold text-cyan-300 mb-6">4. 分析可视化曲线</h2>
            <div class="chart-wrap mb-6 min-h-[350px]"><canvas id="chart1"></canvas></div>
            <div class="chart-wrap mb-6 min-h-[260px]"><canvas id="chart2"></canvas></div>
            <div class="chart-wrap min-h-[260px]"><canvas id="chart3"></canvas></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.min.js"></script>
<script>
// ====================== 全局状态 ======================
let rawData = { time: [], values: [] };
let charts = { c1: null, c2: null, c3: null };

// ====================== FFT 库 ======================
function FFT(size) {
    this.n = size;
    this.bits = Math.log2(size);
    if ((1 << this.bits) !== size) throw new Error("FFT尺寸必须为2的整数次幂");
    this.real = new Array(size).fill(0);
    this.imag = new Array(size).fill(0);
}
FFT.prototype.transform = function(input) {
    const n = this.n;
    for (let i = 0; i < n; i++) {
        this.real[i] = input[2 * i];
        this.imag[i] = input[2 * i + 1] || 0;
    }
    let j = 0;
    for (let i = 1; i < n; i++) {
        let m = n >> 1;
        for (; j >= m; m >>= 1) j -= m;
        j += m;
        if (i < j) {
            [this.real[i], this.real[j]] = [this.real[j], this.real[i]];
            [this.imag[i], this.imag[j]] = [this.imag[j], this.imag[i]];
        }
    }
    for (let s = 1; s <= this.bits; s++) {
        const m = 1 << s, mh = m >> 1;
        const ang = -2 * Math.PI / m;
        const wr = Math.cos(ang), wi = Math.sin(ang);
        for (let k = 0; k < n; k += m) {
            let wrk = 1, wik = 0;
            for (let j = 0; j < mh; j++) {
                const t1r = wrk * this.real[k + j + mh] - wik * this.imag[k + j + mh];
                const t1i = wrk * this.imag[k + j + mh] + wik * this.real[k + j + mh];
                const t2r = this.real[k + j], t2i = this.imag[k + j];
                this.real[k + j] = t2r + t1r;
                this.imag[k + j] = t2i + t1i;
                this.real[k + j + mh] = t2r - t1r;
                this.imag[k + j + mh] = t2i - t1i;
                const wrkNew = wrk * wr - wik * wi;
                const wikNew = wrk * wi + wik * wr;
                wrk = wrkNew; wik = wikNew;
            }
        }
    }
    for (let i = 0; i < n; i++) {
        input[2 * i] = this.real[i];
        input[2 * i + 1] = this.imag[i];
    }
};

// ====================== 文件解析 ======================
function parseFile(text, fileName) {
    const lines = text.replaceAll('\r', '').split('\n').filter(l => l.trim());
    if (lines.length < 2) throw new Error("文件行数不足");
    
    const isCSV = fileName.toLowerCase().endsWith('.csv') || lines[0].includes(',');
    const headers = isCSV ? lines[0].split(',').map(h => h.trim().replace(/"/g, '')) : lines[0].trim().split(/\s+/);
    const dataLines = lines.slice(1);
    
    // 智能识别时间列与光强列
    let timeIdx = headers.findIndex(h => /time|t\b/i.test(h));
    if (timeIdx === -1) timeIdx = 0; 
    let valIdx = headers.findIndex(h => /Luminance|Luma|Light|Intensity/i.test(h));
    if (valIdx === -1) valIdx = headers.length > 1 ? 1 : 0;

    const time = [], values = [];
    for (const line of dataLines) {
        const cols = isCSV ? line.split(',') : line.trim().split(/\s+/);
        if (cols.length <= Math.max(timeIdx, valIdx)) continue;
        const t = parseFloat(cols[timeIdx]);
        const v = parseFloat(cols[valIdx]);
        if (!isNaN(t) && !isNaN(v)) { time.push(t); values.push(v); }
    }
    return { time, values };
}

function estimateSamplingRate(time) {
    if (!time || time.length < 10) return null;
    const diffs = [];
    for (let i = 1; i < time.length; i++) {
        const d = time[i] - time[i - 1];
        if (d > 0) diffs.push(d);
    }
    const median = math.median(diffs);
    const filtered = diffs.filter(d => Math.abs(d - median) < median * 0.5);
    return 1 / (filtered.reduce((a, b) => a + b, 0) / filtered.length);
}

// ====================== 核心算法：频域带通 + 过零计数 ======================
function bandpassFilter(signal, fs, lowFreq, highFreq) {
    const N = signal.length;
    const fftSize = Math.pow(2, Math.ceil(Math.log2(N)));
    const fft = new FFT(fftSize);
    const data = new Array(fftSize * 2).fill(0);
    for (let i = 0; i < N; i++) data[2 * i] = signal[i];
    fft.transform(data);
    
    const df = fs / fftSize;
    for (let i = 0; i < fftSize; i++) {
        const freq = i <= fftSize / 2 ? i * df : (i - fftSize) * df;
        const gain = (Math.abs(freq) >= lowFreq && Math.abs(freq) <= highFreq) ? 1 : 0;
        data[2 * i] *= gain;
        data[2 * i + 1] *= gain;
    }
    // 逆FFT
    const invFft = new FFT(fftSize);
    for (let i = 0; i < fftSize; i++) data[2 * i + 1] = -data[2 * i + 1]; // 共轭
    invFft.transform(data);
    const result = new Array(N).fill(0);
    for (let i = 0; i < N; i++) result[i] = data[2 * i] / fftSize; // 实部除以N
    return result;
}

function countFringesByZeroCrossing(signal, fs, threshRatio) {
    const n = signal.length;
    let maxAbs = 0;
    for (let i = 0; i < n; i++) maxAbs = Math.max(maxAbs, Math.abs(signal[i]));
    if (maxAbs < 1e-9) return { count: 0, zcPoints: [] };
    
    const threshold = maxAbs * threshRatio;
    let count = 0;
    let lastSign = 0;
    const zcPoints = []; // 记录过零位置用于绘图
    
    for (let i = 1; i < n; i++) {
        const v = signal[i];
        if (Math.abs(v) < threshold) continue;
        const sign = v > 0 ? 1 : -1;
        if (lastSign !== 0 && sign !== lastSign) {
            count++;
            zcPoints.push({ x: i, y: 0 });
        }
        lastSign = sign;
    }
    return { count: count / 2, zcPoints }; // 每两个过零点代表一个完整条纹
}

function analyzeData(values, time, params) {
    const { fs, minFreq, maxFreq, threshRatio, fringeCoeff } = params;
    
    // 1. 带通滤波
    const filtered = bandpassFilter(values, fs, minFreq, maxFreq);
    
    // 2. 过零计数
    const zcRes = countFringesByZeroCrossing(filtered, fs, threshRatio);
    
    // 3. 修正与应用
    const fringeCount = Math.round(zcRes.count * fringeCoeff * 100) / 100;
    const duration = values.length / fs;
    const estFreq = fringeCount / duration;
    
    // 4. 计算累积条纹数组（用于绘图）
    const cumCycles = [];
    let currentCount = 0;
    let zcIdx = 0;
    for (let i = 0; i < values.length; i++) {
        while (zcIdx < zcRes.zcPoints.length && zcRes.zcPoints[zcIdx].x <= i) {
            currentCount += 0.5; // 每过一次零点，累积0.5个条纹
            zcIdx++;
        }
        // 降采样存储以优化性能
        if (i % 10 === 0) cumCycles.push({ x: i / fs, y: currentCount * fringeCoeff });
    }

    return { fringeCount, filtered, zcPoints: zcRes.zcPoints, estFreq, cumCycles };
}

// ====================== 绘图 ======================
function drawCharts(res, rawValues, fs) {
    Object.values(charts).forEach(c => c && c.destroy());
    const timeAxis = rawValues.map((_, i) => (i / fs).toFixed(3));

    // Chart 1: 原始 vs 滤波
    const ctx1 = document.getElementById("chart1").getContext("2d");
    charts.c1 = new Chart(ctx1, {
        type: "line",
        data: {
            labels: timeAxis,
            datasets: [
                { label: "原始光强 (基线漂移)", data: rawValues, borderColor: "rgba(148, 163, 184, 0.4)", borderWidth: 1, pointRadius: 0, tension: 0.1 },
                { label: "带通滤波后 (纯条纹信号)", data: res.filtered, borderColor: "#06b6d4", borderWidth: 1.5, pointRadius: 0, tension: 0 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { title: { display: true, text: "滤波前后信号对比", color: "#e2e8f0" }, legend: { labels: { color: "#cbd5e1" } } },
            scales: {
                x: { title: { display: true, text: "时间 (s)", color: "#cbd5e1" }, ticks: { color: "#94a3b8", maxTicksLimit: 10 }, grid: { color: "rgba(148,163,184,0.1)" } },
                y: { title: { display: true, text: "幅度", color: "#cbd5e1" }, ticks: { color: "#94a3b8" }, grid: { color: "rgba(148,163,184,0.1)" } }
            }
        }
    });

    // Chart 2: 过零点检测 (截取前 1000 个点展示局部)
    const sampleLimit = Math.min(1000, rawValues.length);
    const ctx2 = document.getElementById("chart2").getContext("2d");
    const sampleZc = res.zcPoints.filter(p => p.x < sampleLimit).map(p => ({ x: p.x / fs, y: 0 }));
    charts.c2 = new Chart(ctx2, {
        type: "scatter",
        data: {
            datasets: [
                { label: "滤波信号", data: res.filtered.slice(0, sampleLimit).map((v, i) => ({x: i/fs, y: v})), borderColor: "#3b82f6", showLine: true, pointRadius: 0, borderWidth: 1.5 },
                { label: "过零点(半周期)", data: sampleZc, backgroundColor: "#ef4444", pointRadius: 3 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { title: { display: true, text: "局部过零点检测 (前1000点)", color: "#e2e8f0" }, legend: { labels: { color: "#cbd5e1" } } },
            scales: {
                x: { type: "linear", title: { display: true, text: "时间 (s)", color: "#cbd5e1" }, ticks: { color: "#94a3b8" }, grid: { color: "rgba(148,163,184,0.1)" } },
                y: { title: { display: true, text: "幅度", color: "#cbd5e1" }, ticks: { color: "#94a3b8" }, grid: { color: "rgba(148,163,184,0.1)" } }
            }
        }
    });

    // Chart 3: 累积条纹数
    const ctx3 = document.getElementById("chart3").getContext("2d");
    charts.c3 = new Chart(ctx3, {
        type: "line",
        data: {
            labels: res.cumCycles.map(p => p.x.toFixed(2)),
            datasets: [{ label: "累积条纹数 N", data: res.cumCycles.map(p => p.y), borderColor: "#10b981", borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: "rgba(16, 185, 129, 0.1)" }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { title: { display: true, text: "累积条纹数随时间变化", color: "#e2e8f0" }, legend: { labels: { color: "#cbd5e1" } } },
            scales: {
                x: { title: { display: true, text: "时间 (s)", color: "#cbd5e1" }, ticks: { color: "#94a3b8", maxTicksLimit: 10 }, grid: { color: "rgba(148,163,184,0.1)" } },
                y: { title: { display: true, text: "累积条纹数", color: "#cbd5e1" }, ticks: { color: "#94a3b8" }, grid: { color: "rgba(148,163,184,0.1)" } }
            }
        }
    });
}

// ====================== 事件绑定 ======================
document.getElementById("fileInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        try {
            const parsed = parseFile(ev.target.result, file.name);
            if (parsed.values.length === 0) throw new Error("未找到有效数据");
            rawData = parsed;
            
            const fsEst = estimateSamplingRate(rawData.time);
            const fsInput = document.getElementById("samplingRate");
            if (fsEst) fsInput.value = fsEst.toFixed(2);
            
            document.getElementById("fileInfo").innerHTML = 
                `已加载: ${parsed.values.length} 个点 | 自动采样率: <b>${fsEst ? fsEst.toFixed(2) : '未知'} Hz</b>`;
            
            // 清空旧结果
            document.getElementById("fringeCount").innerText = "--";
            document.getElementById("waveM").innerText = "--";
            document.getElementById("waveNm").innerText = "--";
            document.getElementById("errMsg").innerText = "";
            document.getElementById("warnMsg").innerText = "";
            Object.values(charts).forEach(c => c && c.destroy());
        } catch(err) { alert("解析失败：" + err.message); }
    };
    reader.readAsText(file);
});

function runFullAnalysis() {
    const errDom = document.getElementById("errMsg");
    errDom.innerText = "";
    try {
        if (rawData.values.length === 0) throw new Error("请先上传数据");
        
        const fs = Number(document.getElementById("samplingRate").value);
        const minFreq = Number(document.getElementById("minFreq").value);
        const maxFreq = Number(document.getElementById("maxFreq").value);
        const threshRatio = Number(document.getElementById("thresholdCoeff").value);
        const fringeCoeff = Number(document.getElementById("fringeCoeff").value);
        const dispMm = Number(document.getElementById("displacement").value);

        if (!fs || fs <= 0) throw new Error("采样率无效");
        if (maxFreq <= minFreq) throw new Error("最大频率必须大于最小频率");
        if (isNaN(dispMm) || dispMm <= 0) throw new Error("请输入合法的位移 (mm)");

        const params = { fs, minFreq, maxFreq, threshRatio, fringeCoeff };
        const res = analyzeData(rawData.values, rawData.time, params);
        
        document.getElementById("fringeCount").innerText = res.fringeCount;
        document.getElementById("actualFs").innerText = fs.toFixed(2);
        document.getElementById("estFreq").innerText = res.estFreq.toFixed(3);
        
        const dM = dispMm / 1000;
        const waveM = (2 * dM) / res.fringeCount;
        document.getElementById("waveM").innerText = waveM.toExponential(4);
        document.getElementById("waveNm").innerText = (waveM * 1e9).toFixed(2);

        drawCharts(res, rawData.values, fs);
    } catch(err) {
        errDom.innerText = "分析错误：" + err.message;
        Object.values(charts).forEach(c => c && c.destroy());
    }
}
</script>
